name: Espejo de feeds y publicación

# Ni el feed de carreteras de Vegagerðin ni el de peligro de olas de SafeTravel
# mandan cabeceras CORS, así que la app no puede leerlos desde el navegador.
# Copiándolos al repo, GitHub Pages los sirve desde el mismo dominio y el
# problema desaparece.
#
# El espejo y la publicación van en la MISMA corrida a propósito. Un push hecho
# con el GITHUB_TOKEN no dispara ningún workflow —GitHub lo bloquea para evitar
# bucles— así que si el deploy viviera en otro archivo con `on: push`, los
# commits del bot nunca lo despertarían: el espejo seguiría corriendo en verde
# y el sitio publicado se quedaría congelado en los datos del día que se subió.

# El viaje terminó el 14 de octubre de 2026 y aquí se apagó el espejo automático.
# La app se queda publicada tal cual, con los últimos datos que alcanzó a bajar.
# Para revivirla basta con descomentar el bloque `schedule` de abajo: no se quitó
# nada más, ni del workflow ni del repo.
#
# Lo que sigue vivo:
#   - un push a main vuelve a publicar el sitio, que es como se corrige algo
#     desde el iPhone (los datos no se tocan, ver el `if` de los dos pasos del
#     espejo más abajo);
#   - Run workflow a mano baja feeds frescos igual que durante el viaje. El
#     enlace «pedir datos nuevos» de la app apunta ahí y sigue sirviendo.
on:
  # schedule:
  #   # EXPERIMENTO desde el 10 sep 2026: con '7,37' (2/hora) GitHub sólo corría el
  #   # 12% de las veces —3 de 26 en 13 horas—. Se subió a 6/hora para ver si pedir
  #   # más seguido daba más corridas reales o si GitHub castiga la frecuencia.
  #   # Todos los minutos evitan el :00, que es cuando su cola se satura.
  #   - cron: '3,13,23,33,43,53 * * * *'
  push:
    branches: [main]         # una edición desde el iPhone publica al momento
  workflow_dispatch:          # y a mano desde la pestaña Actions

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: carreteras
  # Sin cancelación: si algo se rompe a media Islandia y se dispara una corrida
  # manual para repararlo, no queremos que el siguiente cron la mate a medias.
  cancel-in-progress: false

jobs:
  espejar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Si los feeds islandeses están caídos, se publica igual con los datos
      # anteriores. Publicar algo viejo es mejor que no publicar nada.
      #
      # Terminado el viaje, el espejo sólo corre si alguien toca Run workflow.
      # En un push NO corre, a propósito: así corregir un hotel o subir la V del
      # service worker vuelve a publicar la app sin reemplazar los datos con los
      # que terminó el viaje, que es justo lo que se quiso conservar.
      - name: Bajar y filtrar los feeds
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python3 scripts/carreteras.py

      - name: Guardar si cambió algo
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          if git diff --quiet -- app/data/carreteras.json app/data/reynisfjara.json app/data/estaciones.json; then
            echo "sin cambios"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/carreteras.json app/data/reynisfjara.json app/data/estaciones.json
          git commit -m "feeds: $(date -u '+%d %b %H:%M') UTC"
          git push || (git pull --rebase && git push)

      - uses: actions/configure-pages@v5
        if: always()
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: ./app
      - id: deploy
        if: always()
        uses: actions/deploy-pages@v4
